services:
  - type: web
    name: aqua-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: MQTT_URL
        value: mqtt://broker.hivemq.com:1883
      - key: MQTT_PREFIX
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
